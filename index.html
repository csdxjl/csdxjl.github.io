<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="./7.ico" type="image/x-icon">
	<title>CSDXJL</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			background: #000000;
			height: 100vh;
			width: 100vw;
			position: fixed;
			user-select: none;
		}

		.titlediv {
			position: absolute;
			margin-left: 2vw;
		}

		.title {
			color: rgba(255, 255, 255, 1);
			font-family: "Maple Mono NF CN", system-ui, sans-serif;
			font-size: 7vw;
			font-weight: lighter;
		}

		#titlediv-1 {
			animation: titlediv-1 0.5s ease-in-out forwards;
		}

		@keyframes titlediv-1 {
			0% {
				transform: scale(1.0);
			}

			50% {
				transform: scale(1.1);
			}

			100% {
				transform: scale(1.0);
			}
		}


		#titlediv-2 {
			animation: titlediv-2 0.5s ease-in-out forwards;
		}

		@keyframes titlediv-2 {
			0% {
				transform: translate(0vw, 0vh) scale(1.0);
				opacity: 1.0;
			}

			100% {
				transform: translate(12vw, 10vh) scale(1.7);
				opacity: 0.3;
			}
		}

		#titlediv-3 {
			animation: titlediv-3 0.5s ease-in-out forwards;
		}

		@keyframes titlediv-3 {
			0% {
				transform: translate(0vw, 0vh) scale(1.0);
				opacity: 1.0;
			}

			100% {
				transform: translate(27vw, 30vh) scale(2.5);
				opacity: 0.2;
			}
		}

		#titlediv-4 {
			animation: titlediv-4 0.5s ease-in-out forwards;
		}

		@keyframes titlediv-4 {
			0% {
				transform: translate(0vw, 0vh) scale(1.0);
				opacity: 1.0;
			}

			100% {
				transform: translate(65vw, 55vh) scale(5);
				opacity: 0.1;
			}
		}

		#introduction {
			color: #ffffff;
			font-family: "Maple Mono NF CN", system-ui, sans-serif;
			font-weight: lighter;
			font-size: 4vh;
			font-style: italic;
			white-space: nowrap;
			animation: introduction 0.5s ease-in forwards;
			transform: scale(0);
			opacity: 0;
		}

		@keyframes introduction {
			0% {
				transform: scale(0);
				opacity: 0;
			}

			100% {
				transform: scale(1.0);
				opacity: 1.0;
			}
		}

		#arrow {
			color: #ffffffbb;
			position: absolute;
			font-size: 6vw;
			margin-top: 80vh;
			margin-left: 47vw;
			transform: rotate(90deg);
		}

		#arrowtext {
			color: #ffffff9c;
			position: absolute;
			font-size: 3vh;
			margin-top: 95vh;
			margin-left: 41vw;
			font-family: "Maple Mono NF CN", system-ui, sans-serif;
			font-weight: lighter;
		}

		.pages {
			height: 100vh;
			width: 100vw;
			position: absolute;
			opacity: 0;
			transform: scaleY(0);
			transition: all 1s ease-in-out;
			transform-origin: bottom center;
		}

		.active {
			opacity: 1;
			transform: scaleY(1);
		}
	</style>
</head>

<body>
	<div id="page1" class="pages active">
		<div class="titlediv" id="titlediv-1">
			<i class="title">C</i>
			<i class="title">S</i>
			<i class="title">D</i>
			<i class="title">X</i>
			<i class="title">J</i>
			<i class="title">L</i>
			<i id="introduction">'s personal page</i>
		</div>
		<div class="titlediv" id="titlediv-2">
			<i class="title">C</i>
			<i class="title">S</i>
			<i class="title">D</i>
			<i class="title">X</i>
			<i class="title">J</i>
			<i class="title">L</i>
		</div>
		<div class="titlediv" id="titlediv-3">
			<i class="title">C</i>
			<i class="title">S</i>
			<i class="title">D</i>
			<i class="title">X</i>
			<i class="title">J</i>
			<i class="title">L</i>
		</div>
		<div class="titlediv" id="titlediv-4">
			<i class="title">C</i>
			<i class="title">S</i>
			<i class="title">D</i>
			<i class="title">X</i>
			<i class="title">J</i>
			<i class="title">L</i>
		</div>
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page2" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page3" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page4" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page5" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page6" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to continue……</p>
	</div>
	<div id="page7" class="pages">
		<p id="arrow">&#8669;</p>
		<p id="arrowtext">Scroll to nothing……</p>
	</div>
</body>
<script>
	let pageindex = 1;
	const maxpageindex = 7;
	let height = window.innerHeight;
	let width = window.innerWidth;
	document.addEventListener("resize", e => {
		height = window.innerHeight;
		width = window.innerWidth;
	})

	let fingerY = 0;
	document.addEventListener("touchstart", e => {
		e.preventDefault();
		if (e.touches.length == 1) {
			const touch = e.touches[0];
			fingerY = touch.clientY;
		}
	}, { passive: false })

	document.addEventListener("touchmove", e => {
		e.preventDefault();
	}, { passive: false })

	document.addEventListener("touchend", e => {
		e.preventDefault();
		if (e.changedTouches.length == 1) {
			const touch = e.changedTouches[0];
			if (touch.clientY - fingerY < 0) {
				pageindex = pageindex == maxpageindex ? maxpageindex : pageindex + 1;
				reloadPages();
			} else if (touch.clientY - fingerY > 0) {
				pageindex = pageindex == 1 ? 1 : pageindex - 1;
				reloadPages();
			}
		}
	}, { passive: false })

	document.addEventListener("touchcancel", e => {
		e.preventDefault();
		if (e.changedTouches.length == 1) {
			const touch = e.changedTouches[0];
			if (touch.clientY - fingerY < 0) {
				pageindex = pageindex == maxpageindex ? maxpageindex : pageindex + 1;
				reloadPages();
			} else if (touch.clientY - fingerY > 0) {
				pageindex = pageindex == 1 ? 1 : pageindex - 1;
				reloadPages();
			}
		}
	}, { passive: false })

	let wheelLock = false;
	document.addEventListener("wheel", e => {
		e.preventDefault();
		if (wheelLock) return;

		if (e.deltaY > 0) {
			pageindex = pageindex == maxpageindex ? maxpageindex : pageindex + 1;
		} else if (e.deltaY < 0) {
			pageindex = pageindex == 1 ? 1 : pageindex - 1;
		} else {
			return;
		}
		reloadPages();

		wheelLock = true;
		setTimeout(() => wheelLock = false, 1000);
	}, { passive: false });

	function reloadPages() {
		document.querySelectorAll('.pages').forEach(p => {
			p.classList.remove('active');
		})
		const id = `page${pageindex}`;
		const nextpage = document.getElementById(id);
		nextpage.classList.add('active');
	}
</script>

</html>
